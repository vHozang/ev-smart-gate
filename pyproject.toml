[project]
name = "ev-smart-gate"
version = "0.1.0"
description = "He thong Smart Gate va xac minh xuat kho tu dong"
requires-python = ">=3.11,<3.14"
dependencies = [
  "argon2-cffi>=25,<26",
  "beanie>=2.2,<3",
  "cryptography>=46,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "minio>=7.2,<8",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "pydantic-settings>=2.10,<3",
  "pymongo>=4.11,<5",
  "PyJWT[crypto]>=2.15.1,<3",
  "pyzbar>=0.1.9,<1",
  "python-multipart>=0.0.20,<1",
  "qrcode[pil]>=8,<9",
  "rapidfuzz>=3.14,<4",
  "reportlab>=4.4,<5",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
vision = [
  "fast-alpr[onnx]==0.4.0",
  "onnxruntime>=1.19,<2",
  "paddleocr>=3.3,<4",
]
vision-yolov8 = ["ultralytics>=8.3,<9"]
vision-deepface = ["deepface>=0.0.100,<1"]

[dependency-groups]
dev = [
  "asgi-lifespan>=2.1,<3",
  "faker>=37,<38",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_gate", "src/edge_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]
markers = [
  "integration: cần MongoDB replica set và MinIO thật",
  "e2e: cần Docker Compose đang chạy",
  "real_model: tải và chạy model AI thật",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"src/smart_gate/infrastructure/database/documents.py" = ["RUF012"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = [
  "fast_alpr",
  "onnxruntime",
  "paddleocr",
  "pyzbar.*",
  "ultralytics",
  "deepface",
  "qrcode",
  "reportlab.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["smart_gate.infrastructure.database.documents"]
disable_error_code = ["assignment"]
