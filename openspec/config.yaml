schema: intent-driven

context: |
  Domain: hệ thống Smart Gate và xác minh xuất kho tự động.

  Tech stack:
  - Python 3.11, FastAPI async, Pydantic v2
  - Beanie 2.2 trên PyMongo Async và MongoDB replica set
  - MinIO private bucket, mã hóa AES-GCM ở tầng ứng dụng
  - FastALPR/PaddleOCR, YuNet/SFace, YOLOX/OpenCV
  - Compact JWS Ed25519, QR, HTML và PDF
  - FastAPI WebSocket và REST resync

  Architecture: Clean Architecture. Dependency hướng vào trong:
  Presentation -> Application -> Domain <- Infrastructure.

  Quy ước:
  - Tài liệu, comment và docstring viết bằng tiếng Việt.
  - Identifier và schema field dùng tiếng Anh kỹ thuật.
  - AI chỉ tạo observation, không được gọi barrier trực tiếp.
  - Mọi lỗi AI, camera, storage hoặc device phải fail-closed.
  - Mỗi use case mới phải có unit test.

rules:
  proposal:
    - Nêu rõ mục tiêu, phạm vi và rủi ro an ninh.
  specs:
    - Dùng requirement cùng scenario Given/When/Then.
  design:
    - Ghi rõ layer, Protocol port và adapter hạ tầng liên quan.
  tasks:
    - Sắp xếp domain -> application -> infrastructure -> presentation -> bootstrap -> test.
    - Mỗi task phải đủ nhỏ để review độc lập.
