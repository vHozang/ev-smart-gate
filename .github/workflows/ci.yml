name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install --group dev .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: node --check src/smart_gate/presentation/static/assets/app.js
      - run: pytest --cov=smart_gate --cov-report=term-missing
      - run: python scripts/export_openapi.py
      - run: git diff --exit-code -- docs/openapi.json

  playwright-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up -d --build mongodb mongodb-init minio minio-init barrier-simulator camera-simulator api
      - run: timeout 120 sh -c 'until curl -fsS http://localhost:8000/health/ready; do sleep 3; done'
      - run: npm run demo:test
      - id: sanitize
        if: always()
        run: node scripts/demo/sanitize-artifacts.mjs
      - if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .playwright/demo-results/
            dist/demo/playwright-report/
            dist/demo/timeline.json
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install --group dev .
      - run: docker compose up -d --build mongodb mongodb-init minio minio-init barrier-simulator api
      - run: timeout 120 sh -c 'until curl -fsS http://localhost:8000/health/ready; do sleep 3; done'
      - run: docker compose --profile workflow run --rm workflow-simulator
      - run: RUN_INTEGRATION=1 MONGODB_URI='mongodb://localhost:27017/?replicaSet=rs0&directConnection=true' MINIO_ENDPOINT=localhost:9000 pytest tests/integration -q
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
